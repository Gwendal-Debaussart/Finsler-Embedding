[project]
name = "finsler-embedding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Theau Blanchard", email = "theau.blanchard@inria.fr" },
    { name = "Gwendal Debaussart-Joniec", email = "gwendal.debaussart@ens-paris-saclay.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "geodesic-toolbox",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "networkx>=3.6.1",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "pytest>=9.2.0",
    "seaborn>=0.13.2",
    "torchvision>=0.29.0",
]

[project.scripts]
finsler-embedding = "finsler_embedding.evaluate:main"

[build-system]
requires = ["uv_build>=0.12.7,<=0.13.1"]
build-backend = "uv_build"

[tool.uv.sources]
geodesic-toolbox = { path = "../geodesic_toolbox", editable = true }
